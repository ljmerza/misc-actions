name: Python Build
description: Build an sdist and wheel with uv, optionally checking the version against the release tag first

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  working-directory:
    description: Project root directory
    required: false
    default: "."
  expected-version:
    description: 'Version the build must match, tag form or bare (e.g. "v1.0.0" or "1.0.0"). Skips the check if empty.'
    required: false
    default: ""
  artifact-name:
    description: Name of the uploaded dist artifact
    required: false
    default: "dist"

outputs:
  version:
    description: Version read from pyproject.toml
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Read the version from pyproject.toml
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
        if [ -z "$VERSION" ]; then
          echo "::error::no 'version = \"...\"' line found in pyproject.toml"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "pyproject version: $VERSION"

    - name: Check the version matches the release tag
      if: inputs.expected-version != ''
      shell: bash
      env:
        EXPECTED: ${{ inputs.expected-version }}
        PROJECT: ${{ steps.version.outputs.version }}
      run: |
        # Tags are conventionally v-prefixed; pyproject versions never are.
        if [ "${EXPECTED#v}" != "$PROJECT" ]; then
          echo "::error::$EXPECTED does not match pyproject version $PROJECT"
          exit 1
        fi
        echo "building version $PROJECT"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv build

    - name: Upload dist
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/dist/*
