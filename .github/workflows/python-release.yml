name: Python Release

# Publishes a Python package to PyPI via OIDC trusted publishing, then cuts a
# GitHub Release with the built artifacts attached.
#
#   publish-pypi -> github-release
#
# No API token is stored anywhere: the deployment environment plus
# `id-token: write` is what PyPI verifies. A tag whose PyPI publish failed
# never becomes a release.
#
# The calling job must declare `id-token: write` and `contents: write`, and the
# calling repo must define the deployment environment named by `environment`
# with a matching PyPI trusted publisher.

on:
  workflow_call:
    inputs:
      package-name:
        description: PyPI project name, used for the environment URL and the default release title
        required: true
        type: string
      python-version:
        description: Python version to build with
        type: string
        default: "3.12"
      working-directory:
        description: Project root directory
        type: string
        default: "."
      environment:
        description: Deployment environment holding the PyPI trusted-publisher configuration
        type: string
        default: pypi
      verify-version:
        description: Fail if the tag does not match the version in pyproject.toml
        type: boolean
        default: true
      release-title:
        description: 'Release title (defaults to "<package-name> <tag>")'
        type: string
        default: ""
      prerelease:
        description: Mark the GitHub Release as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://pypi.org/p/${{ inputs.package-name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ljmerza/misc-actions/actions/python-build@v2.2.0
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
          expected-version: ${{ inputs.verify-version && github.ref_name || '' }}

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.working-directory }}/dist

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ljmerza/misc-actions/actions/github-release@v2.2.0
        with:
          tag: ${{ github.ref_name }}
          title: ${{ inputs.release-title != '' && inputs.release-title || format('{0} {1}', inputs.package-name, github.ref_name) }}
          prerelease: ${{ inputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
